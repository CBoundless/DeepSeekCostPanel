name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build EXE (PyInstaller)
        run: |
          pyinstaller --clean --noconsole --onefile --name DeepSeekCostPanel gui_cost_control.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekCostPanel-windows-exe
          path: dist/DeepSeekCostPanel.exe
